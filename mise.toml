# Tooling for the gitops repo. The cluster tooling (kubectl, helm, manifest
# validation) is declared here when the cluster arrives.
[tools]
sops = "3.13.3"
age  = "1.3.2"
jq   = "1.8.2"

[env]
# Same path on macOS and Linux. Without it sops looks in a macOS-only location.
SOPS_AGE_KEY_FILE = "{{env.HOME}}/.config/sops/age/keys.txt"
